:root[data-theme="dark"]{--bg:#0c1a21;--fg:#e8f1f3;--mut:#9db3bb;--card:#13262f;--pri:#5fc8e0;--sand:#1d2f36;--bd:#25404b;--grn:#6fcf97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px}
.logo{font:800 1.15rem Fraunces,Georgia,serif;color:var(--pri);text-decoration:none}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 8px 6px;scrollbar-width:none}
nav a{padding:6px 11px;border-radius:99px;color:var(--fg);text-decoration:none;white-space:nowrap;font-size:.92rem}
nav a.on{background:var(--pri);color:#fff}
button,select,input,textarea{font:inherit;color:var(--fg)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--sand);color:var(--fg)}
.sm{padding:5px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(165deg,#0b5d7a 10%,#14b8a6 65%,#f1e6cf);color:#fff;border-radius:22px;padding:34px 18px 22px;margin-bottom:22px}
.hero h1{font-size:clamp(1.9rem,6vw,3.2rem);max-width:15ch}
.hero p{margin:8px 0 18px;max-width:46ch}
.sf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:var(--card);padding:10px;border-radius:14px}
.sf input,.sf select,.f select,.f input,.fm input,.fm select,.fm textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.sec{margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:1.5rem}
.sec a{color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{height:120px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;position:relative}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img small{position:absolute;bottom:4px;left:8px;font-size:.68rem;color:#fff;opacity:.85}
.t-b{background:linear-gradient(135deg,#0b5d7a,#2dd4bf)}.t-s{background:linear-gradient(135deg,#a8742f,#e7c98b)}.t-f{background:linear-gradient(135deg,#b4532a,#f0a35e)}.t-p{background:linear-gradient(135deg,#1f6b3f,#8ccf7e)}.t-e{background:linear-gradient(135deg,#4a4e9c,#86a8e7)}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:1.1rem}
.mut{color:var(--mut);font-size:.88rem}
.tg{display:flex;gap:4px;flex-wrap:wrap}
.tg span{background:var(--sand);border-radius:99px;padding:2px 9px;font-size:.78rem}
.cb .btn{margin-top:auto}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fm{display:grid;gap:10px;max-width:520px}
dialog{border:0;border-radius:18px;max-width:560px;width:calc(100% - 24px);background:var(--card);color:var(--fg);padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dc{padding:18px;display:grid;gap:10px}
.note{background:var(--sand);border-radius:10px;padding:8px 12px;font-size:.85rem}
svg.map{width:100%;max-width:340px;background:var(--sand);border-radius:16px}
.mapw{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.dot{cursor:pointer}
footer{padding:24px 14px;text-align:center;color:var(--mut);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.hero{animation:f .7s ease both}@keyframes f{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>

function list(ty,title){const r=filt(ty);return `<div class="sec"><h2>${title}</h2></div>${filters()}<p class="mut">${r.length}</p><div class="grid">${r.map(card).join("")||`<p>${t().none}</p>`}</div>`}
function row(ty,h,r){const L=t(),a=r||D.filter(i=>i[1]===ty).slice(0,3);return `<div class="sec"><h2>${h}</h2>${ty?`<a href="#${r?"destinos":{b:"praias",s:"hoteis",f:"restaurantes",p:"parques",e:"experiencias"}[ty]}">${L.all}</a>`:""}</div><div class="grid">${a.map(card).join("")}</div>`}
function dist(a,b,c,d){const r=x=>x*Math.PI/180,k=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(k))}
function mapView(){const L=t(),pv=F.prov;const P=D.filter(i=>!pv||i[3]===pv);const pts=P.map(i=>`<circle class="dot" data-d="${i[0]}" cx="${((i[5]-30)*27.3).toFixed(0)}" cy="${((-i[4]-10)*32.5).toFixed(0)}" r="7" fill="${COL[i[1]]}" stroke="#fff" stroke-width="2"><title>${i[2]}</title></circle>`).join("");
return `<div class="sec"><h2>${L.nav[8][1]}</h2></div><p class="mut">${L.mapn}</p><div class="row"><select id="mp"><option value="">${L.anyp}</option>${PR.map(p=>`<option ${pv===p?"selected":""}>${p}</option>`).join("")}</select></div><div class="mapw"><svg class="map" viewBox="0 0 300 560" role="img" aria-label="Mapa"><polygon points="${[[40.4,-10.6],[40.6,-14],[39.5,-16.3],[37,-18],[35,-20.5],[35.4,-22.5],[35.5,-24],[33.8,-25.8],[32.9,-26.9],[32.4,-26.9],[32,-26],[31.9,-23],[31.3,-22.4],[32.4,-21.3],[33,-19.8],[32.7,-19],[32.9,-17],[31.2,-16],[30.2,-15.6],[32.7,-16.5],[33,-14],[34.8,-14.3],[34.5,-11.6],[36.5,-11.7]].map(p=>((p[0]-30)*27.3).toFixed(0)+","+((-p[1]-10)*32.5).toFixed(0)).join(" ")}" fill="var(--card)" stroke="var(--pri)" stroke-width="2"/>${pts}</svg><div>${Object.keys(IC).map(k=>`<div><span style="color:${COL[k]}">●</span> ${IC[k]} ${L.types[k]}</div>`).join("")}</div></div>`}
function assist(){const L=t();return `<div class="sec"><h2>${L.nav[9][1]}</h2></div><form class="fm" id="as"><label>${L.from}<select name="o">${PR.map(p=>`<option>${p}</option>`).join("")}</select></label><label>${L.exp}<select name="x">${["paradise","family","romantic","surf","dive","calm","safari","culture","nature","budget"].map(k=>`<option value="${k}">${L.tags[k]}</option>`).join("")}</select></label><label>${L.bud}<select name="b">${MAXM.map((v,i)=>`<option value="${i+1}" ${i===2?"selected":""}>${L.band[i]}</option>`).join("")}</select></label><label>${L.dur}<select name="d"><option value="day">${L.day}</option><option value="wk">${L.wk}</option><option value="hol">${L.hol}</option></select></label><label>${L.who}<select name="w"><option>${L.solo}</option><option>${L.cpl}</option><option value="fam">${L.fam}</option><option>${L.grp}</option></select></label><button class="btn">${L.rec}</button></form><div id="ar"></div>`}
function recs(f){const o=PC[f.o.value],x=f.x.value,b=+f.b.value,d=f.d.value,w=f.w.value;const lim={day:300,wk:900,hol:9e3}[d];
return D.filter(i=>i[1]!=="f").map(i=>{const k=dist(o[0],o[1],i[4],i[5]);let s=0;if(i[7].split(",").includes(x))s+=4;if(i[6]<=b)s+=2;if(k<=lim)s+=3;else s-=3;if(w==="fam"&&i[7].includes("family"))s+=2;if(w==="Casal"&&i[7].includes("romantic")||w==="Couple"&&i[7].includes("romantic"))s+=2;return[s-k/2000,i]}).sort((a,c)=>c[0]-a[0]).slice(0,5).map(a=>a[1])}
function show(id){const i=find(id),L=t(),on=favs.includes(id);$("#dg").innerHTML=`<div class="dc">${pic(i[0],i[2])?`<div class="img t-${i[1]}" style="height:200px">${pic(i[0],i[2])}<small>${cred(i[0])}</small></div>`:""}<h2>${IC[i[1]]} ${i[2]}</h2><div class="mut">${i[3]} · ${L.types[i[1]]}</div><div class="tg">${tg(i[7])}</div><p>${it(i)}</p><div><b>${L.acts}:</b> ${i[8].split(",").map(a=>L.acts[a]).join(", ")}</div><div><b>${L.bud}:</b> ${L.band[i[6]-1]}</div><div><b>${L.contact}:</b> ${L.cons}</div><div class="note">${L.demo}</div><div class="row"><button class="btn" id="df">${on?L.unfav:"♥ "+L.fav}</button><button class="btn alt" id="dx">${L.close}</button></div></div>`;
$("#dg").showModal();$("#dx").onclick=()=>$("#dg").close();$("#df").onclick=()=>{favs=on?favs.filter(x=>x!==id):[...favs,id];try{localStorage.setItem("dm_fav",JSON.stringify(favs))}catch(e){}$("#dg").close();render()}}
function contact(){const L=t();return `<div class="sec"><h2>${L.nav[11][1]}</h2></div><p>${L.partners}</p><form class="fm" id="cf"><input required placeholder="${L.name}" aria-label="${L.name}"><input type="email" required placeholder="Email" aria-label="Email"><select><option>${L.sug}</option><option>${L.nav[11][1]}</option><option>${lang==="pt"?"Quero divulgar o meu serviço":"I want to promote my service"}</option></select><textarea rows="4" required placeholder="${L.msg}" aria-label="${L.msg}"></textarea><button class="btn">${L.send}</button></form><p id="cm" class="note" hidden></p>${WA?`<p><a class="btn" href="https://wa.me/${WA}">WhatsApp</a></p>`:`<p class="mut">WhatsApp: ${lang==="pt"?"define o número na constante WA":"set the number in the WA constant"}</p>`}`}
function render(){const L=t(),h=(location.hash||"#home").slice(1),L2=L.nav;document.documentElement.lang=lang;document.title="Descobre Moçambique · "+L.slogan;$("#lg").textContent=lang==="pt"?"EN":"PT";$("#fc").textContent=favs.length;
$("#nav").innerHTML=L2.map(n=>`<a href="#${n[0]}" class="${n[0]===h?"on":""}">${n[1]}</a>`).join("");$("#ft").textContent="© Descobre Moçambique · "+L.demo;
let v="";if(h==="home")v=`<section class="hero"><h1>${L.h1}</h1><p>${L.slogan}</p><form class="sf" id="hs"><input name="q" placeholder="${L.q}" aria-label="${L.q}"><select name="x"><option value="">${L.anyx}</option>${Object.keys(L.tags).slice(0,10).map(k=>`<option value="${k}">${L.tags[k]}</option>`).join("")}</select><select name="b">${MAXM.map((v,i)=>`<option value="${i+1}" ${i===4?"selected":""}>${i<4?"≤ "+v.toLocaleString("pt-PT")+" MZN":L.anyb}</option>`).join("")}</select><button class="btn">${L.go}</button></form><div class="row"><button class="btn alt" id="ins">✨ ${L.insp}</button></div></section>`+row("b",L.types.b)+row("s",L.types.s)+row("f",L.types.f)+row("p",L.types.p)+row("e",L.cheap,D.filter(i=>i[6]<=2).slice(0,6));
else if(h==="destinos")v=list("",L.nav[1][1]);else if(h==="praias")v=list("b",L.types.b);else if(h==="hoteis")v=list("s",L.types.s);else if(h==="restaurantes")v=list("f",L.types.f);else if(h==="parques")v=list("p",L.types.p);else if(h==="experiencias")v=list("e",L.types.e);
else if(h==="roteiros")v=`<div class="sec"><h2>${L.nav[7][1]}</h2></div>`+R.map(r=>`<div class="sec"><h3>${r[1][lang]}</h3><span class="mut">${r[2]} · ${L[r[4]]}</span></div><div class="grid">${r[3].map(x=>card(find(x))).join("")}</div>`).join("");
else if(h==="mapa")v=mapView();else if(h==="ajuda")v=assist();else if(h==="favoritos")v=`<div class="sec"><h2>♥ ${L.favs}</h2></div><div class="grid">${favs.map(x=>card(find(x))).join("")||`<p>${L.nofav}</p>`}</div>`;
else if(h==="sobre")v=`<div class="sec"><h2>${L2[10][1]}</h2></div><p style="max-width:60ch">${L.about}</p>`;else if(h==="contactos")v=contact();
$("#m").innerHTML=v;bind()}
function bind(){const g=(s,f)=>{const e=$(s);if(e)e.onchange=f};
const fq=$("#fq");if(fq)fq.oninput=e=>{F.q=e.target.value;clearTimeout(window._t);window._t=setTimeout(()=>{render();const x=$("#fq");x.focus();x.setSelectionRange(99,99)},250)};
g("#fp",e=>{F.prov=e.target.value;render()});g("#ft2",e=>{F.tag=e.target.value;render()});g("#fb",e=>{F.max=+e.target.value+1;render()});g("#mp",e=>{F.prov=e.target.value;render()});
const hs=$("#hs");if(hs)hs.onsubmit=e=>{e.preventDefault();F={q:hs.q.value,prov:"",tag:hs.x.value,max:+hs.b.value};location.hash="destinos"};
const ins=$("#ins");if(ins)ins.onclick=()=>show(D[Math.floor(Math.random()*D.length)][0]);
const as=$("#as");if(as)as.onsubmit=e=>{e.preventDefault();$("#ar").innerHTML=`<div class="sec"><h2>${t().rec}</h2></div><div class="grid">${recs(as).map(card).join("")}</div>`;$("#ar").scrollIntoView({behavior:"smooth"})};
const cf=$("#cf");if(cf)cf.onsubmit=e=>{e.preventDefault();const c=$("#cm");c.hidden=false;c.textContent=t().sent}}
document.addEventListener("click",e=>{const d=e.target.closest("[data-d]");if(d)show(d.dataset.d)});
$("#lg").onclick=()=>{lang=lang==="pt"?"en":"pt";try{localStorage.setItem("dm_lang",lang)}catch(e){}render()};
$("#fv").onclick=()=>{location.hash="favoritos"};
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
render();
</script>
</body>
</html>
